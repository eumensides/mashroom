name: 自动处理蘑菇网页（CDN加速 + WebP + 图标 + 返回按钮）

on:
  push:
    paths:
      - '**.html'
  workflow_dispatch:

jobs:
  patch-html:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 运行网页批处理脚本
        run: |
          python3 - << 'PYEOF'
          import os, re

          SKIP = {"index.html"}   # 汇总页单独维护，跳过

          # ── 常量 ────────────────────────────────────────────────
          FAVICON = (
              '<link rel="icon" href="data:image/svg+xml,'
              "%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E"
              "%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%84%3C/text%3E"
              "%3C/svg%3E\">"
          )

          BACK_CSS = """
            /* ── 返回菌物志悬浮按钮 ── */
            .back-btn {
              position: fixed; top: 16px; left: 16px; z-index: 9999;
              display: inline-flex; align-items: center; gap: 6px;
              padding: 8px 14px;
              background: rgba(255,255,255,0.92);
              backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
              border: 1px solid rgba(0,0,0,0.12); border-radius: 999px;
              font-size: 13px; font-weight: 500; color: #3a3a3a;
              text-decoration: none;
              box-shadow: 0 2px 12px rgba(0,0,0,0.12);
              transition: background .18s, box-shadow .18s, transform .15s;
            }
            .back-btn:hover {
              background: rgba(255,255,255,1);
              box-shadow: 0 4px 20px rgba(0,0,0,0.18);
              transform: translateY(-1px);
            }
            .back-btn svg { flex-shrink: 0; }
          """

          BACK_HTML = """<!-- 返回菌物志悬浮按钮 add_back_button -->
          <a class="back-btn" href="https://eumensides.github.io/mashroom/">
            <svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M6.85355 3.14645C7.04882 3.34171 7.04882 3.65829 6.85355 3.85355L3.70711 7H12.5C12.7761 7 13 7.22386 13 7.5C13 7.77614 12.7761 8 12.5 8H3.70711L6.85355 11.1464C7.04882 11.3417 7.04882 11.6583 6.85355 11.8536C6.65829 12.0488 6.34171 12.0488 6.14645 11.8536L2.14645 7.85355C1.95118 7.65829 1.95118 7.34171 2.14645 7.14645L6.14645 3.14645C6.34171 2.95118 6.65829 2.95118 6.85355 3.14645Z" fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"/>
            </svg>
            菌物志
          </a>
          """

          # ── 工具函数 ─────────────────────────────────────────────
          def replace_img_tag(m):
              """把 <img src="...png/jpg"> 换成 img+onerror 降级写法"""
              src_orig = m.group(1)
              alt      = m.group(3)
              src_webp = re.sub(r'\.(png|jpg|jpeg)$', '.webp', src_orig)
              return (
                  f'<img src="{src_webp}" '
                  f'onerror="this.src=\'{src_orig}\'" '
                  f'alt="{alt}" loading="lazy">'
              )

          # ── 主循环 ───────────────────────────────────────────────
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if not d.startswith(".")]
              for fname in files:
                  if not fname.lower().endswith(".html"):
                      continue
                  if fname in SKIP:
                      continue

                  path = os.path.join(root, fname)
                  with open(path, encoding="utf-8") as f:
                      html = f.read()

                  changed = False

                  # 1. github.io → jsDelivr CDN（图片用）
                  new_html = re.sub(
                      r'https://eumensides\.github\.io/mashroom/([^"\']+\.(png|jpg|jpeg|webp))',
                      r'https://cdn.jsdelivr.net/gh/eumensides/mashroom@main/\1',
                      html
                  )
                  if new_html != html:
                      html = new_html
                      changed = True

                  # 2. img → img+onerror webp 降级（跳过已处理）
                  new_html = re.sub(
                      r'<img\s+src="(https://cdn\.jsdelivr\.net/[^"]+\.(png|jpg|jpeg))"\s+alt="([^"]*)"[^>]*>',
                      replace_img_tag,
                      html
                  )
                  if new_html != html:
                      html = new_html
                      changed = True

                  # 3. favicon
                  if 'rel="icon"' not in html and "rel='icon'" not in html:
                      if "<title>" in html:
                          html = html.replace("<title>", FAVICON + "\n  <title>", 1)
                      elif "</head>" in html:
                          html = html.replace("</head>", FAVICON + "\n</head>", 1)
                      changed = True

                  # 4. 返回按钮
                  if "add_back_button" not in html:
                      if "</style>" in html:
                          html = html.replace("</style>", BACK_CSS + "\n  </style>", 1)
                      body_m = re.search(r"<body[^>]*>", html)
                      if body_m:
                          pos  = body_m.end()
                          html = html[:pos] + "\n" + BACK_HTML + html[pos:]
                      changed = True

                  if changed:
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(html)
                      print(f"  ✓ 已处理: {fname}")
                  else:
                      print(f"  — 无变化: {fname}")

          print("\n✅ 全部处理完成")
          PYEOF

      - name: 提交修改
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A "*.html"
          if git diff --cached --quiet; then
            echo "没有需要提交的修改"
          else
            git commit -m "🍄 自动处理：CDN加速 / WebP降级 / 图标 / 返回按钮"
            git push
          fi
